apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: sre-alertmanager-config
  namespace: monitoring
  labels:
    release: prometheus
spec:
  route:
    groupBy: ['alertname', 'namespace', 'severity']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: 'slack-notifications'
    routes:
      - matchers:
          - name: severity
            value: critical
        receiver: 'pagerduty-critical'
        repeatInterval: 1h
      - matchers:
          - name: severity
            value: warning
        receiver: 'slack-notifications'

  receivers:
    - name: 'slack-notifications'
      slackConfigs:
        - channel: '#prod-alerts'
          sendResolved: true
          apiURL:
            name: alertmanager-slack-secret
            key: webhook_url
          title: '🚨 [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
          text: >-
            *Namespace:* `{{ .CommonLabels.namespace }}`
            *Service:* `{{ .CommonLabels.service }}`
            *Summary:* {{ .CommonAnnotations.summary }}
            *Description:* {{ .CommonAnnotations.description }}
            *Runbook:* <{{ .CommonAnnotations.runbook_url }}|View Runbook>

    - name: 'pagerduty-critical'
      slackConfigs:
        - channel: '#critical-incidents'
          sendResolved: true
          apiURL:
            name: alertmanager-slack-secret
            key: webhook_url
          title: '🔥 [CRITICAL OUTAGE] {{ .CommonLabels.alertname }}'
          text: 'Immediate on-call intervention required: {{ .CommonAnnotations.description }}'
